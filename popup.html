<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timestamp bookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app">
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="bookmarks" type="button">Bookmarks</button>
      <button class="tab" data-view="videos" type="button">Saved videos</button>
    </div>
    <section id="bookmarks-view">
      <div class="add-row">
        <input id="note" maxlength="120" placeholder="Add a note (optional)" aria-label="Bookmark note">
        <button id="save" class="primary" type="button">+ Save</button>
        <div id="loop-bar" class="loop-bar" hidden>
          <span id="loop-range"></span>
          <button id="loop-toggle" type="button">Loop</button>
        </div>
      </div>
      <div id="bookmark-list" class="list"></div>
      <p class="loop-hint">Select 2 timestamps to loop.</p>
    </section>
    <section id="videos-view" hidden>
      <input id="video-search" class="search" type="search" placeholder="Search saved videos" aria-label="Search saved videos">
      <div id="video-list" class="list"></div>
    </section>
    <p id="status" class="status" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
